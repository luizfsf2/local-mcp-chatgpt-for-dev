[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-mcp-chatgpt-for-dev"
version = "0.1.0"
description = "Local MCP bridge for Claude Code and Codex sessions running under Herdr Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
]

[tool.setuptools]
packages = ["herdr_bridge"]
